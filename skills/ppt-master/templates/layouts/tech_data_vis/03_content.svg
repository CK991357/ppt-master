<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <text x="80" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#546E7A">{{PAGE_TITLE}}</text>
  <line x1="80" y1="90" x2="300" y2="90" stroke="#00838F" stroke-width="4"/>

  <rect x="80" y="120" width="1120" height="520" fill="none" stroke="#90A4AE" stroke-width="1.5" stroke-dasharray="6,6" rx="12"/>
  <text x="640" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#90A4AE" font-style="italic">{{CONTENT_AREA}}</text>

  <text x="80" y="690" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#90A4AE">数据来源：{{SOURCE}}</text>
  <text x="1200" y="690" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#90A4AE">{{PAGE_NUM}}</text>
</svg>