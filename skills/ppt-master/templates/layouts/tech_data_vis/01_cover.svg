<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="hexGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F4E7A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6A1B9A" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#FFFFFF"/>

  <polygon points="1100,100 1200,150 1200,250 1100,300 1000,250 1000,150" fill="url(#hexGrad)" stroke="none"/>

  <rect x="290" y="200" width="700" height="280" rx="12" fill="#FFFFFF" filter="url(#softShadow)"/>

  <line x1="340" y1="240" x2="940" y2="240" stroke="#00838F" stroke-width="2" opacity="0.6"/>

  <text x="640" y="320" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="#546E7A">{{TITLE}}</text>

  <text x="640" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#90A4AE">{{SUBTITLE}}</text>

  <text x="640" y="650" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#90A4AE">{{DATE}} ｜ {{AUTHOR}} ｜ 公众号：{{WECHAT_PUBLIC_NAME}}</text>

  <circle cx="580" cy="680" r="4" fill="#1F4E7A"/>
  <circle cx="600" cy="680" r="4" fill="#2E7D32"/>
  <circle cx="620" cy="680" r="4" fill="#6A1B9A"/>
  <circle cx="640" cy="680" r="4" fill="#00838F"/>
  <circle cx="660" cy="680" r="4" fill="#1F4E7A"/>
  <circle cx="680" cy="680" r="4" fill="#2E7D32"/>
  <circle cx="700" cy="680" r="4" fill="#6A1B9A"/>
</svg>